name: Check

# Skill-repository gate (§2.5), skill side: this skill content × a *released*
# compatible runtime. A skill PR may not claim a command that runtime rejects.
#
# Two independent halves:
#   audit + wrapper — needs no runtime, so packaging and the gate itself are
#                     verified on every PR and on all three hosts;
#   contract        — checks out the released runtime and runs its shared tests.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  audit:
    name: package audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Whitelist, frontmatter and required files
        run: python3 build.py --check
      - name: Pack
        run: python3 build.py --pack
      - name: The ZIP is a whitelist with a fixed top-level directory
        run: |
          set -eu
          unzip -l dist/zoe-workflows.zip > /tmp/zip.txt
          cat /tmp/zip.txt
          awk 'NF >= 4 && $4 != "Name" && $4 != "----" {
                 name = $4
                 if (name !~ /^zoe-workflows\//) {
                   print "not under zoe-workflows/: " name; exit 1
                 }
                 if (name !~ /^zoe-workflows\/(SKILL\.md|README\.md|LICENSE|runtime-requirements\.json|references\/|scripts\/)/) {
                   print "outside the whitelist: " name; exit 1
                 }
               }' /tmp/zip.txt
          for required in SKILL.md README.md LICENSE runtime-requirements.json \
                          references/cli-contract.md scripts/zoe.sh scripts/zoe.cmd scripts/zoe.ps1; do
            grep -q "zoe-workflows/$required" /tmp/zip.txt || { echo "missing $required"; exit 1; }
          done
          if grep -qE '\.py$|/src/|/tests/|/docs/' /tmp/zip.txt; then
            echo "non-skill content in the archive"; exit 1
          fi
      - name: The shell wrapper keeps its exec bit in the ZIP
        run: |
          rm -rf /tmp/unzipped && mkdir -p /tmp/unzipped
          unzip -q dist/zoe-workflows.zip -d /tmp/unzipped
          test -x /tmp/unzipped/zoe-workflows/scripts/zoe.sh

  wrapper:
    name: wrapper gate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: No runtime → RUNTIME_NOT_FOUND (126)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set +e
          out="$(env -u ZOE_BIN -u ZOE_SRC PATH=/usr/bin:/bin bash scripts/zoe.sh capabilities --json 2>&1)"
          code=$?
          set -e
          echo "$out"
          [ "$code" -eq 126 ] || { echo "expected 126, got $code"; exit 1; }
          case "$out" in *RUNTIME_NOT_FOUND*) ;; *) echo "missing error code"; exit 1;; esac
          case "$out" in *"pipx install zoe-runtime"*) ;; *) echo "missing fix hint"; exit 1;; esac

      - name: Incompatible runtime → 5, and --version/--which still work
        if: runner.os != 'Windows'
        shell: bash
        run: |
          fake="$RUNNER_TEMP/fakezoe"
          printf '%s\n' '#!/usr/bin/env bash' \
            'if [ "$1" = "--version" ]; then echo 0.4.9; exit 0; fi' \
            'exit 5' > "$fake"
          chmod +x "$fake"
          set +e
          out="$(ZOE_BIN="$fake" bash scripts/zoe.sh capabilities --json 2>&1)"
          code=$?
          set -e
          echo "$out"
          [ "$code" -eq 5 ] || { echo "expected 5, got $code"; exit 1; }
          case "$out" in *RUNTIME_INCOMPATIBLE*) ;; *) echo "missing error code"; exit 1;; esac
          [ "$(ZOE_BIN="$fake" bash scripts/zoe.sh --version)" = "0.4.9" ] || { echo "--version blocked"; exit 1; }
          ZOE_BIN="$fake" bash scripts/zoe.sh --which | grep -q '"source":"ZOE_BIN"' || { echo "--which wrong"; exit 1; }

      - name: Compatible runtime → forwarded through the same path
        if: runner.os != 'Windows'
        shell: bash
        run: |
          fake="$RUNNER_TEMP/goodzoe"
          marker="$RUNNER_TEMP/marker.txt"
          cat > "$fake" <<'EOF'
          #!/usr/bin/env bash
          if [ "$1" = "--version" ]; then echo 1.0.0; exit 0; fi
          if [ "$1" = "capabilities" ]; then echo '{"ok":true}'; exit 0; fi
          printf '%s\n' "$*" > "$MARKER"
          EOF
          # the heredoc is indented for YAML; strip the leading spaces
          sed -i.bak 's/^[[:space:]]*//' "$fake"
          chmod +x "$fake"
          MARKER="$marker" ZOE_BIN="$fake" bash scripts/zoe.sh demo --json
          grep -q 'demo --json' "$marker" || { echo "request was not forwarded"; exit 1; }

      - name: ZOE_SRC binding runs the checkout's package (`src` layout)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          root="$RUNNER_TEMP/fakesrc"
          mkdir -p "$root/src"
          : > "$root/src/__init__.py"
          printf '%s\n' \
            'import sys' \
            'if sys.argv[1:2] == ["--version"]:' \
            '    print("1.0.0"); raise SystemExit(0)' \
            'if sys.argv[1:2] == ["capabilities"]:' \
            '    print("{}"); raise SystemExit(0)' \
            'print("FORWARDED", " ".join(sys.argv[1:]))' > "$root/src/__main__.py"
          out="$(ZOE_SRC="$root" bash scripts/zoe.sh demo --json)"
          echo "$out"
          case "$out" in *"FORWARDED demo --json"*) ;; *) echo "ZOE_SRC did not forward"; exit 1;; esac
          ZOE_SRC="$root" bash scripts/zoe.sh --which | grep -q '"source":"ZOE_SRC"' || { echo "--which wrong"; exit 1; }
          # A directory passed instead of the repository root must be rejected.
          set +e
          ZOE_SRC="$root/src" bash scripts/zoe.sh --version >/dev/null 2>&1
          code=$?
          set -e
          [ "$code" -eq 126 ] || { echo "expected 126 for src/ as ZOE_SRC, got $code"; exit 1; }

      - name: No runtime → RUNTIME_NOT_FOUND (126) on Windows, stdout is valid JSON
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:ZOE_BIN = $null
          $env:ZOE_SRC = $null
          # stdout and stderr are captured separately: the error document must be
          # on **stdout** (the runtime's own channel). A wrapper that used stderr
          # would make every host merge two streams, so the separation here is the
          # assertion, not an implementation detail.
          $outFile = Join-Path $env:RUNNER_TEMP 'notfound.out'
          $err = Join-Path $env:RUNNER_TEMP 'notfound.err'
          $p = Start-Process -FilePath cmd -ArgumentList '/c', 'scripts\zoe.cmd capabilities --json' `
                 -NoNewWindow -Wait -PassThru -RedirectStandardError $err -RedirectStandardOutput $outFile
          $text = Get-Content -Raw -Path $outFile
          Write-Host $text
          if ($p.ExitCode -ne 126) { throw "expected 126, got $($p.ExitCode)" }
          if ("$(Get-Content -Raw -Path $err)".Trim()) { throw "error document must be on stdout only" }
          $doc = $text | ConvertFrom-Json
          if ($doc.error.code -ne 'RUNTIME_NOT_FOUND') { throw "missing error code" }
          if ($doc.error.hint -notmatch 'pipx install zoe-runtime') { throw "missing fix hint" }

      - name: A runtime that cannot import itself → RUNTIME_BROKEN (126) on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $fake = Join-Path $env:RUNNER_TEMP 'brokenzoe.cmd'
          Set-Content -Encoding ascii -Path $fake -Value @(
            '@echo off',
            'echo Traceback: ImportError cannot import src.cli',
            'exit /b 1'
          )
          $env:ZOE_BIN = $fake
          $outFile = Join-Path $env:RUNNER_TEMP 'broken.out'
          $err = Join-Path $env:RUNNER_TEMP 'broken.err'
          $p = Start-Process -FilePath cmd -ArgumentList '/c', 'scripts\zoe.cmd capabilities --json' `
                 -NoNewWindow -Wait -PassThru -RedirectStandardError $err -RedirectStandardOutput $outFile
          $text = Get-Content -Raw -Path $outFile
          Write-Host $text
          if ($p.ExitCode -ne 126) { throw "expected 126, got $($p.ExitCode)" }
          $doc = $text | ConvertFrom-Json
          if ($doc.error.code -ne 'RUNTIME_BROKEN') { throw "expected RUNTIME_BROKEN, got $($doc.error.code)" }

      - name: Incompatible runtime → exit 5 on Windows, --version/--which still work
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $fake = Join-Path $env:RUNNER_TEMP 'fakezoe.cmd'
          Set-Content -Encoding ascii -Path $fake -Value @(
            '@echo off',
            'if "%1"=="--version" goto ver',
            'exit /b 5',
            ':ver',
            'echo 0.4.9',
            'exit /b 0'
          )
          $env:ZOE_BIN = $fake
          $out = cmd /c scripts\zoe.cmd capabilities --json 2>&1
          $code = $LASTEXITCODE
          Write-Host $out
          if ($code -ne 5) { throw "expected 5, got $code" }
          if ("$out" -notmatch 'RUNTIME_INCOMPATIBLE') { throw "missing error code" }
          $version = cmd /c scripts\zoe.cmd --version
          if ($LASTEXITCODE -ne 0) { throw "--version was blocked" }
          if ("$version".Trim() -ne '0.4.9') { throw "unexpected version: $version" }
          $which = cmd /c scripts\zoe.cmd --which
          if ("$which" -notmatch 'ZOE_BIN') { throw "--which did not report the source" }

      - name: The PowerShell wrapper forwards and preserves the exit code
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $fake = Join-Path $env:RUNNER_TEMP 'goodzoe.cmd'
          Set-Content -Encoding ascii -Path $fake -Value @(
            '@echo off',
            'if "%1"=="--version" goto ver',
            'if "%1"=="capabilities" goto gate',
            'echo %* > "%MARKER%"',
            'exit /b 0',
            ':ver',
            'echo 1.0.0',
            'exit /b 0',
            ':gate',
            'exit /b 0'
          )
          $env:ZOE_BIN = $fake
          $env:MARKER = Join-Path $env:RUNNER_TEMP 'marker.txt'
          pwsh -File scripts/zoe.ps1 demo --json
          if ($LASTEXITCODE -ne 0) { throw "expected 0, got $LASTEXITCODE" }
          if (-not (Select-String -Path $env:MARKER -Pattern 'demo --json' -Quiet)) {
            throw "request was not forwarded"
          }

      - name: ZOE_SRC binding on Windows (repository root, not src\)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'fakesrc'
          New-Item -ItemType Directory -Force -Path (Join-Path $root 'src') | Out-Null
          Set-Content -Encoding ascii -Path (Join-Path $root 'src\__init__.py') -Value ''
          Set-Content -Encoding ascii -Path (Join-Path $root 'src\__main__.py') -Value @(
            'import sys',
            'if sys.argv[1:2] == ["--version"]:',
            '    print("1.0.0"); raise SystemExit(0)',
            'if sys.argv[1:2] == ["capabilities"]:',
            '    print("{}"); raise SystemExit(0)',
            'print("FORWARDED", " ".join(sys.argv[1:]))'
          )
          $env:ZOE_BIN = $null
          $env:ZOE_SRC = $root
          $out = cmd /c scripts\zoe.cmd demo --json 2>&1
          $code = $LASTEXITCODE
          Write-Host $out
          if ($code -ne 0) { throw "expected 0, got $code" }
          if ("$out" -notmatch 'FORWARDED demo --json') { throw "ZOE_SRC did not forward" }
          $which = cmd /c scripts\zoe.cmd --which
          if ("$which" -notmatch 'ZOE_SRC') { throw "--which did not report the source" }
          $env:ZOE_SRC = Join-Path $root 'src'
          cmd /c scripts\zoe.cmd --version > $null 2>&1
          if ($LASTEXITCODE -ne 126) { throw "expected 126 for src\ as ZOE_SRC, got $LASTEXITCODE" }

  # 释放组合（v1.4.1）。一个 skill 只有在**具名的 runtime** 上验证过才算过，
  # 而「具名」必须是这个 skill 自己能接受的那个版本 —— 否则 job 会长期红着，
  # 或者更糟：长期绿着，因为它验证的是一个早就没人装的旧运行时。
  #
  #   1. 发布验证（阻断）：候选 wheel（构建产物，不是源码树）× 本 skill
  #   2. 已发布兼容下限（阻断）：RUNTIME_PIN 必须等于 min_version
  #   3. 前沿漂移监测（不阻断）：runtime main × 本 skill
  #
  # main × main 只能发现漂移，不能代替可复现的发布验证，所以它不阻断。
  contract:
    name: contract with the pinned runtime (candidate wheel)
    runs-on: ubuntu-latest
    env:
      # 与 runtime-requirements.json 的 min_version 是**同一个数**；下面的
      # guard 步骤把它变成红检查，而不是靠人记得一起改。
      RUNTIME_PIN: v1.4.0
    steps:
      - uses: actions/checkout@v4

      - name: The pin must be inside this skill's own window
        run: |
          python3 - <<'PY'
          import json, os, re, sys

          req = json.load(open("runtime-requirements.json"))
          pin = os.environ["RUNTIME_PIN"].lstrip("v")

          def key(text):
              return tuple(int(part) for part in re.findall(r"\d+", text)) or (0,)

          if key(pin) < key(req["min_version"]):
              sys.exit(
                  f"RUNTIME_PIN {pin} < min_version {req['min_version']}: the skill is "
                  "tested against a runtime it refuses to accept — bump RUNTIME_PIN"
              )
          if key(pin) >= key(req["max_version_exclusive"]):
              sys.exit(f"RUNTIME_PIN {pin} is outside the skill's declared window")
          print(f"pin {pin} inside [{req['min_version']}, {req['max_version_exclusive']})")
          PY

      - uses: actions/checkout@v4
        with:
          repository: zoe-runtime/zoe-runtime
          ref: ${{ env.RUNTIME_PIN }}
          path: .runner/zoe-runtime

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build the candidate wheel (the artifact, not the source tree)
        working-directory: .runner/zoe-runtime
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel --outdir dist

      - name: Install it outside the source tree
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/venv/bin/python" -m pip install .runner/zoe-runtime/dist/*.whl pytest
          echo "CANDIDATE=$RUNNER_TEMP/venv/bin/python" >> "$GITHUB_ENV"

      - name: The installed wheel accepts this skill's window
        run: |
          cd "$RUNNER_TEMP"
          "$CANDIDATE" -m src capabilities --check-requirements \
            "$GITHUB_WORKSPACE/runtime-requirements.json"

      - name: Every documented command and option must exist
        working-directory: .runner/zoe-runtime
        run: |
          ZOE_SKILL_DIR="$GITHUB_WORKSPACE" \
            "$CANDIDATE" -m pytest -q tests/contract tests/test_doc_contracts.py \
              tests/test_contract_artifacts.py

  contract-drift:
    name: drift watch (runtime main × this skill)
    runs-on: ubuntu-latest
    # 漂移是**信息**，不是合并门禁：让 main 上的运行器改动提前暴露出来，
    # 但不因为上游一个未发布的提交把本仓库的 PR 判红。
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: zoe-runtime/zoe-runtime
          ref: main
          path: .runner/zoe-runtime
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install the runtime from main
        working-directory: .runner/zoe-runtime
        run: pip install -e '.[dev]'
      - name: Contract surface still holds on main
        working-directory: .runner/zoe-runtime
        run: |
          ZOE_SKILL_DIR="$GITHUB_WORKSPACE" \
            pytest -q tests/contract tests/test_doc_contracts.py tests/test_contract_artifacts.py
      - name: This skill's window still accepts main
        run: |
          python -m src capabilities --check-requirements \
            "$GITHUB_WORKSPACE/runtime-requirements.json"
